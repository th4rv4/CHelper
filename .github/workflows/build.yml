name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like 'refs/tags/v*') { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = ([xml](Get-Content src/CHelper.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version $v"

      - name: Publish single exe
        run: dotnet publish src/CHelper.csproj -c Release -o out -p:Version=${{ env.APP_VERSION }}

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ env.APP_VERSION }}" installer/CHelper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem out -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
            Write-Host "$($_.Name)  SHA256 $hash"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: CHelper
          path: |
            out/CHelper.exe
            out/CHelper-Setup-*.exe
            out/*.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/CHelper-Setup-*.exe
            out/CHelper.exe
            out/*.sha256
          generate_release_notes: true
