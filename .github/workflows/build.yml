name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags, for the release notes

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like 'refs/tags/v*') { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = ([xml](Get-Content src/CHelper.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version $v"

      - name: Publish single exe
        run: dotnet publish src/CHelper.csproj -c Release -o out -p:Version=${{ env.APP_VERSION }}

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ env.APP_VERSION }}" installer/CHelper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem out -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
            Write-Host "$($_.Name)  SHA256 $hash"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: CHelper
          path: |
            out/CHelper.exe
            out/CHelper-Setup-*.exe
            out/*.sha256

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Commits since the previous version tag, sorted into Added / Fixed / Changed / Removed by their first word.
          $prev = git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $subjects = git log $range --no-merges --reverse --format='%s'
          $groups = [ordered]@{ 'Added' = @(); 'Fixed' = @(); 'Changed' = @(); 'Removed' = @() }
          foreach ($s in $subjects) {
            if ($s -match '^(Bump version|Merge )') { continue }
            $first = ($s -split '\s+')[0]
            $group = switch -Regex ($first) {
              '^(Fix|Keep|Stop|Retry|Handle|Reopen|Ask|Avoid|Prevent|Restore|Correct|Don''t)$' { 'Fixed' }
              '^(Remove|Drop|Revert)$' { 'Removed' }
              '^(Add|Check|Show|Support|Allow|Optionally|Introduce)$' { 'Added' }
              default { 'Changed' }
            }
            $groups[$group] += $s
          }
          $notes = @()
          foreach ($g in $groups.Keys) {
            if ($groups[$g].Count -eq 0) { continue }
            $notes += "### $g"
            $notes += $groups[$g] | ForEach-Object { "- $_" }
            $notes += ''
          }
          if ($notes.Count -eq 0) { $notes += 'Maintenance release.'; $notes += '' }
          $notes += '### Install'
          $notes += 'Download `CHelper-Setup-${{ env.APP_VERSION }}.exe` below, or update from inside C-Helper (click the version number in the footer).'
          if ($prev) { $notes += ''; $notes += "**Full list of changes:** https://github.com/${{ github.repository }}/compare/$prev...${{ github.ref_name }}" }
          $notes -join "`n" | Out-File release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/CHelper-Setup-*.exe
            out/CHelper.exe
            out/*.sha256
          body_path: release-notes.md
